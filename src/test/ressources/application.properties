# Base de données \u2014 même BDD que local, valeurs en dur pour les tests
spring.datasource.url=jdbc:postgresql://localhost:5432/fsc_tournament
spring.datasource.username=fsc_tournament
spring.datasource.password=ton_mot_de_passe_ici

# Schéma recréé à chaque run du seed
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT \u2014 valeur factice suffisante pour le contexte de test
jwt.secret=test-secret-key-for-seed-only-32-chars-min
jwt.expiration=86400000

# CORS et cookie \u2014 valeurs neutres pour les tests
app.cors.allowed-origins=http://localhost:4200
app.cookie.secure=false

# Pas de context-path pour les tests
server.servlet.context-path=/filsanguinairecholetais